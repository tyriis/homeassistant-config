---
alias: Bedroom Light Switch
id: bedroom_light_switch
description: >-
  Senic wall switch in the bedroom. Left rocker cycles the skylight
  off -> dim -> full -> off (up advances, down steps back); right rocker
  toggles the Govee LED strip.
mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: sensor.senic_wall_switch_bedroom_action
    from: null
    to: press_1
    id: left_up
  - trigger: state
    entity_id: sensor.senic_wall_switch_bedroom_action
    from: null
    to: press_2
    id: left_down
  - trigger: state
    entity_id: sensor.senic_wall_switch_bedroom_action
    from: null
    to: press_3
    id: right_press
  - trigger: state
    entity_id: sensor.senic_wall_switch_bedroom_action
    from: null
    to: press_4
    id: right_press

variables:
  brightness: >-
    {{ state_attr('light.skylight_9aa7', 'brightness') | default(0) | int(0) }}
  is_full: "{{ brightness > 128 }}"

actions:
  - choose:
      # Left rocker up: off -> dim, dim -> full, full -> off
      - conditions:
          - condition: trigger
            id: left_up
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: light.skylight_9aa7
                    state: "off"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.skylight_9aa7
                    data:
                      brightness: 50 # ~20%, same as Aqara double press
              - conditions:
                  - condition: state
                    entity_id: light.skylight_9aa7
                    state: "on"
                  - condition: template
                    value_template: "{{ not is_full }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.skylight_9aa7
                    data:
                      brightness: 255
              - conditions:
                  - condition: state
                    entity_id: light.skylight_9aa7
                    state: "on"
                  - condition: template
                    value_template: "{{ is_full }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: light.skylight_9aa7

      # Left rocker down: full -> dim, dim -> off, off -> nothing
      - conditions:
          - condition: trigger
            id: left_down
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: light.skylight_9aa7
                    state: "on"
                  - condition: template
                    value_template: "{{ is_full }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.skylight_9aa7
                    data:
                      brightness: 50
              - conditions:
                  - condition: state
                    entity_id: light.skylight_9aa7
                    state: "on"
                  - condition: template
                    value_template: "{{ not is_full }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: light.skylight_9aa7

      # Right rocker (either button): toggle Govee LED strip
      - conditions:
          - condition: trigger
            id: right_press
        sequence:
          - action: light.toggle
            target:
              entity_id: light.rgbic_pro_strip_lights_2
