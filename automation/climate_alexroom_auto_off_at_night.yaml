---
alias: Climate Alexroom Auto Off At Night
id: climate_alexroom_auto_off_at_night
description: >
  Automatically turns off the alexroom AC after 23:00
mode: single
trigger:
  - platform: time_pattern
    minutes: "/5"

condition:
  # Only act if the climate is currently on, and there is no manual override
  - condition: template
    value_template: >
      {{
        states('climate.alexroom') == 'cool'
        and states('binary_sensor.hisense_ac_alexroom_automation_block_status') == 'off'
        and (now().hour >= 22 or now().hour < 8)
      }}

actions:
  # Release existing lock if it exists
  - action: rest_command.release_lock
    data:
      name: hisense_ac_alexroom
  # Turn off the AC
  - action: climate.turn_off
    target:
      entity_id: climate.alexroom
  # Log the action
  - action: system_log.write
    data:
      level: info
      message: Alexroom AC turned off after 23:00.
      logger: >-
        homeassistant.components.automation.climate_alexroom_auto_off_at_night
